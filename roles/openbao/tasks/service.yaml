---
# service-specific tasks file for openbao

- name: Start and enable the OpenBao Lego trigger
  ansible.builtin.systemd:
    name: "lego@{{ openbao_service_name }}.trigger"
    enabled: true
  when: >-
    not ansible_check_mode
  tags:
    - openbao
    - systemd
    - service

- name: Start and enable the OpenBao service
  ansible.builtin.systemd:
    name: "{{ openbao_service_name }}.service"
    enabled: true
    state: started
  when: >-
    not ansible_check_mode
  tags:
    - openbao
    - systemd
    - service
