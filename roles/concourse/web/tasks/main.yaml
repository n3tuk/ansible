---
# tasks file for concourse/web

- name: Run pre-flight checks
  ansible.builtin.include_tasks:
    file: pre-flight.yaml

- name: Install on Arch Linux
  ansible.builtin.include_tasks:
    file: arch.yaml
  when: >-
    ansible_facts.distribution == 'Archlinux'

- name: Configure Concourse Web Service
  ansible.builtin.include_tasks:
    file: configure.yaml

- name: Set up the Concourse firewall rules
  ansible.builtin.include_tasks:
    file: firewall.yaml

- name: Set up Concourse Web Service
  ansible.builtin.include_tasks:
    file: service.yaml

- name: Configure Caddy for Concourse Web
  ansible.builtin.include_tasks:
    file: caddy.yaml
