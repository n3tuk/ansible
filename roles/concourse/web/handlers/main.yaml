---
# handlers file for concourse/web

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    not ansible_check_mode

- name: Restart {{ concourse_web_service_name }}.service
  ansible.builtin.systemd:
    name: "{{ concourse_web_service_name }}.service"
    state: restarted
  when: >-
    not ansible_check_mode

- name: Reload {{ concourse_web_service_name }}.service
  ansible.builtin.systemd:
    name: "{{ concourse_web_service_name }}.service"
    state: reloaded
  when: >-
    not ansible_check_mode

- name: Trigger Lego for Concourse Web certificate renewal
  ansible.builtin.systemd:
    name: "lego@{{ concourse_web_service_name }}.service"
    state: started
  when: >-
    not ansible_check_mode
