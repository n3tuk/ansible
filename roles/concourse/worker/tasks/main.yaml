---
# tasks file for concourse/worker

- name: Run pre-flight checks
  ansible.builtin.include_tasks:
    file: pre-flight.yaml

- name: Install on Arch Linux
  ansible.builtin.include_tasks:
    file: arch.yaml
  when: >-
    ansible_facts.distribution == 'Archlinux'

- name: Configure the Concourse Worker Service
  ansible.builtin.include_tasks:
    file: configure.yaml

- name: Set up the Concourse Web Service
  ansible.builtin.include_tasks:
    file: service.yaml
