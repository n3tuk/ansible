---
# handlers file for concourse/worker

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    not ansible_check_mode

- name: Reload {{ concourse_worker_service_name }}.service
  ansible.builtin.systemd:
    name: "{{ concourse_worker_service_name }}.service"
    state: reloaded
  when: >-
    not ansible_check_mode

- name: Restart {{ concourse_worker_service_name }}.service
  ansible.builtin.systemd:
    name: "{{ concourse_worker_service_name }}.service"
    state: restarted
  when: >-
    not ansible_check_mode
